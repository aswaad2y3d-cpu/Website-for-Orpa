<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Proposal Letter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <!-- Envelope Screen -->
    <div id="envelope-container">
      <img src="envelope.png" alt="Envelope" id="envelope" />
      <p>♡ Letter for Your Highness ♡</p>
    </div>

    <!-- Letter Screen -->
    <div id="letter-container">
      <div class="letter-window">
        <h1 id="letter-title">Will you be my Girlfriend, Your highness?</h1>

        <img src="download GIF.gif" class="cat" id="letter-cat" />

        <div class="buttons" id="letter-buttons">
          <img src="yes.png" class="btn yes-btn" alt="Yes" />

          <div class="no-wrapper">
            <img src="no.png" class="btn no-btn" alt="No" />
          </div>
        </div>

        <p id="final-text" class="final-text" style="display: none">
          <strong>I Love 'You'..Bunny!!🎉</strong> .. Now dance with the cat.. <strong>LETS GO!</strong> 
        </p>
      </div>
    </div>
    <audio id="bgMusic">
    <source src="Background sound.mp3" type="audio/mpeg">
</audio>

<audio id="openSound">
    <source src="open.mp3" type="audio/mpeg">
</audio>

<audio id="yaySound">
    <source src="celebration.mp3" type="audio/mpeg">
</audio>
    <script src="script.js"></script>
  </body>
</html>
